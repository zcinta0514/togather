<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        background: #fbfaf9;
        position: relative;
      }

      /* 背景：两团柔和的色块，和产品里玻璃材质要透出的那种底色一致 */
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
      }
      .b1 {
        width: 620px;
        height: 620px;
        left: -140px;
        top: -220px;
        background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0.28) 55%, transparent 72%);
      }
      .b2 {
        width: 520px;
        height: 520px;
        right: -120px;
        bottom: -200px;
        background: radial-gradient(circle, #f59e0b 0%, rgba(245, 158, 11, 0.26) 55%, transparent 72%);
      }

      .wrap {
        position: relative;
        height: 100%;
        padding: 74px 84px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        width: 46px;
        height: 46px;
        border-radius: 13px;
        background: linear-gradient(135deg, #6366f1, #4f46e5);
        position: relative;
        box-shadow: 0 10px 22px -8px rgba(79, 70, 229, 0.6);
      }
      /* 两个重叠的圆 —— 交集，也就是这个产品在做的事 */
      .mark::before,
      .mark::after {
        content: '';
        position: absolute;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2.5px solid rgba(255, 255, 255, 0.95);
        top: 13px;
      }
      .mark::before {
        left: 8px;
      }
      .mark::after {
        left: 18px;
        background: rgba(255, 255, 255, 0.28);
      }
      .name {
        font-size: 26px;
        font-weight: 600;
        color: #1c1917;
        letter-spacing: 0.5px;
      }

      h1 {
        font-size: 76px;
        font-weight: 700;
        letter-spacing: -2.5px;
        line-height: 1.12;
        color: #1c1917;
        max-width: 940px;
      }

      .sub {
        margin-top: 22px;
        font-size: 27px;
        color: #57534e;
        letter-spacing: 0.2px;
      }

      .chips {
        display: flex;
        gap: 12px;
        margin-top: 34px;
      }
      .chip {
        font-size: 22px;
        padding: 11px 24px;
        border-radius: 999px;
        border: 1.5px solid rgba(120, 113, 108, 0.28);
        color: #57534e;
        background: rgba(255, 255, 255, 0.62);
      }
      .chip.on {
        background: linear-gradient(180deg, #6366f1, #4f46e5);
        border-color: rgba(79, 70, 229, 0.9);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 12px 24px -10px rgba(79, 70, 229, 0.75);
      }

      /* 网格：呼应产品里的涂抹时间格 */
      .grid {
        position: absolute;
        right: 84px;
        bottom: 74px;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
        opacity: 0.95;
      }
      .cell {
        width: 40px;
        height: 40px;
        border-radius: 9px;
        background: #f4f1ee;
        border: 1px solid #e7e2dd;
      }
      .cell.a {
        background: linear-gradient(145deg, #6366f1, #4f46e5);
        border-color: #4338ca;
        box-shadow: 0 6px 14px -6px rgba(79, 70, 229, 0.8);
      }
      .cell.b {
        background: linear-gradient(145deg, #fbbf24, #d97706);
        border-color: #b45309;
      }
    </style>
  </head>
  <body>
    <div class="blob b1"></div>
    <div class="blob b2"></div>

    <div class="wrap">
      <div class="brand">
        <div class="mark"></div>
        <div class="name">Togather</div>
      </div>

      <div>
        <h1>什么时候有空<br />想去哪里，一起定</h1>
        <div class="sub">涂一下你的时间，系统算出大家都行的方案</div>
        <div class="chips">
          <div class="chip on">可以</div>
          <div class="chip">勉强</div>
          <div class="chip">不行</div>
        </div>
      </div>

      <div class="grid" id="grid"></div>
    </div>

    <script>
      // 铺一个网格，几格亮起来 —— 静态图也要有产品感
      const on = new Set([0, 1, 5, 7, 10, 11, 12, 15, 16, 17, 21, 22]);
      const amber = new Set([6, 18]);
      const g = document.getElementById('grid');
      for (let i = 0; i < 25; i++) {
        const d = document.createElement('div');
        d.className = 'cell' + (on.has(i) ? ' a' : amber.has(i) ? ' b' : '');
        g.appendChild(d);
      }
    </script>
  </body>
</html>
